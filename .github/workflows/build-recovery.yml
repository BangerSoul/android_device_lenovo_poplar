name: Build Recovery (TWRP / OrangeFox / AOSP)

# ── Namespace Free-Trial / Budget Rules ────────────────────────────────────────
# Plan: Namespace Developer (30-day free trial, no credit card; $0.0015/unit-min
#       after trial, or apply for free OSS runners at https://namespace.so/opensource).
# Trial limits:
#   • Concurrency: 32 vCPU / 64 GB RAM across all active Linux jobs
#   • Max duration: 180 min (3h) per job; standard shapes only
#   • Rate: nscloud-ubuntu-22.04-amd64-8x16 = 8 unit-min/min (~$0.008/min post-trial;
#           same unit-min price as 4x16 with 2× CPUs and 96 GB disk)
# Rules enforced below:
#   1. Default runner: 8x16 standard shape + scratch mount for swap (/namespace/scratch).
#   2. max-parallel: 2 — caps concurrent jobs at 16 vCPU / 32 GB RAM (50% headroom under 32 vCPU cap).
#   3. timeout-minutes: 120 — hard cap strictly below the 180-min Developer plan ceiling.
#   4. concurrency: cancel-in-progress — supersedes duplicate runs immediately (0 min for cancelled).
#   5. Trigger discipline: push limited to recovery/build paths + fail-fast: false.
#   6. Fallback: workflow_dispatch runner='github-free' switches cleanly back to unlimited
#      public GitHub ubuntu-22.04 runners after the 30-day trial without editing YAML.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Recovery variant to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - twrp
          - orangefox
          - aosp
      runner:
        description: "Runner backend (namespace-8x16 trial default, github-free unlimited public fallback)"
        required: false
        type: choice
        default: namespace-8x16
        options:
          - namespace-8x16
          - namespace-4x8
          - github-free
      twrp_branch:
        description: "minimal-manifest-twrp branch (e.g. twrp-12.1, twrp-14.1)"
        required: false
        default: twrp-12.1
        type: string
      fox_branch:
        description: "OrangeFox sync branch (12.1 ~45GB, 14.1 ~85GB experimental)"
        required: false
        type: choice
        default: "12.1"
        options:
          - "12.1"
          - "14.1"
      aosp_branch:
        description: "AOSP manifest branch/tag for AOSP recovery build"
        required: false
        default: android-14.0.0_r67
        type: string
  push:
    branches:
      - recovery/twrp-orangefox
    paths:
      - "BoardConfig.mk"
      - "AndroidProducts.mk"
      - "device.mk"
      - "poplar_recovery_base.mk"
      - "twrp_poplar.mk"
      - "aosp_poplar.mk"
      - "lineage_poplar.mk"
      - "recovery.fstab"
      - "prebuilt/**"
      - "recovery/**"
      - ".github/workflows/build-recovery.yml"

concurrency:
  group: recovery-${{ github.ref }}-${{ github.event.inputs.variant || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.variant }})
    # ── Free-Trial Rules #1–#3: Namespace 8x16 (16GB RAM, 96GB disk) + scratch swap, max 2 parallel, 120m cap
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github-free') && fromJSON('["ubuntu-22.04"]') || ((github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'namespace-4x8') && fromJSON('["nscloud-ubuntu-22.04-amd64-4x8-with-features", "namespace-features:container.privileged=true;container.mount-scratch=true"]') || fromJSON('["nscloud-ubuntu-22.04-amd64-8x16-with-features", "namespace-features:container.privileged=true;container.mount-scratch=true"]')) }}
    timeout-minutes: 120
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        variant: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.variant != 'all') && fromJSON(format('["{0}"]', github.event.inputs.variant)) || fromJSON('["twrp", "orangefox", "aosp"]') }}

    steps:
      - name: Maximize runner disk space & configure swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git-core gnupg gperf \
            imagemagick lib32ncurses5-dev libelf-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python3 python-is-python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          SWAP_TARGET="/ci-swapfile"
          if [ -d /namespace/scratch ]; then
            SWAP_TARGET="/namespace/scratch/swapfile"
          fi
          if [ ! -f "$SWAP_TARGET" ]; then
            sudo fallocate -l 8G "$SWAP_TARGET" || sudo dd if=/dev/zero of="$SWAP_TARGET" bs=1M count=8192 status=none
            sudo chmod 600 "$SWAP_TARGET"
            sudo mkswap "$SWAP_TARGET"
            sudo swapon "$SWAP_TARGET" || echo "WARN: swapon unavailable on this runner; continuing with physical RAM"
          fi
          sudo sysctl -w vm.swappiness=60 || true
          df -h / /namespace/scratch 2>/dev/null || df -h
          free -h

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.local/bin/repo"
          chmod +x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.name "CI Builder"
          git config --global user.email "ci-builder@users.noreply.github.com"
          git config --global color.ui false

      - name: Checkout poplar device tree (self)
        uses: actions/checkout@v4
        with:
          path: src_device

      - name: Sync TWRP minimal manifest (twrp)
        if: matrix.variant == 'twrp'
        run: |
          mkdir -p "$HOME/work" && cd "$HOME/work"
          TWRP_BR="${{ github.event.inputs.twrp_branch || 'twrp-12.1' }}"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$TWRP_BR"
          repo sync -c -j8 --no-tags --no-clone-bundle --force-sync --optimized-fetch
          rm -rf .repo/project-objects .repo/projects

      - name: Sync OrangeFox manifest (orangefox)
        if: matrix.variant == 'orangefox'
        run: |
          FOX_BR="${{ github.event.inputs.fox_branch || '12.1' }}"
          mkdir -p "$HOME/work" "$HOME/fox-sync"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/fox-sync"
          cd "$HOME/fox-sync"
          bash orangefox_sync.sh --branch "$FOX_BR" --path "$HOME/work"
          rm -rf "$HOME/work/.repo/project-objects" "$HOME/work/.repo/projects" "$HOME/fox-sync"

      - name: Sync AOSP shallow recovery workspace (aosp)
        if: matrix.variant == 'aosp'
        run: |
          mkdir -p "$HOME/work" && cd "$HOME/work"
          AOSP_BR="${{ github.event.inputs.aosp_branch || 'android-14.0.0_r67' }}"
          repo init --depth=1 \
            -u https://android.googlesource.com/platform/manifest -b "$AOSP_BR" \
            --groups=default,-darwin,-cts,-notdefault
          mkdir -p .repo/local_manifests
          curl -fsSL \
            https://raw.githubusercontent.com/minimal-manifest-twrp/platform_manifest_twrp_aosp/twrp-14.1/remove-minimal.xml \
            | sed 's/<remove-project /<remove-project optional="true" /g' \
            > .repo/local_manifests/prune-unused.xml
          repo sync -c -j8 --no-tags --no-clone-bundle --force-sync --optimized-fetch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/soong/java/ravenwood.go")
          if p.is_file():
              src = p.read_text()
              needle = '\t\tlibModule := ctx.GetDirectDepWithTag(lib, ravenwoodLibContentTag)\n'
              guard = (
                  needle
                  + '\t\tif libModule == nil {\n'
                  + '\t\t\tif ctx.Config().AllowMissingDependencies() {\n'
                  + '\t\t\t\tctx.AddMissingDependencies([]string{lib})\n'
                  + '\t\t\t} else {\n'
                  + '\t\t\t\tctx.PropertyErrorf("lib", "missing dependency %q", lib)\n'
                  + '\t\t\t}\n'
                  + '\t\t\tcontinue\n'
                  + '\t\t}\n'
              )
              if 'if libModule == nil' not in src and needle in src:
                  p.write_text(src.replace(needle, guard, 1))
                  print("Applied TeamWin/AOSP e2019ec guard to build/soong/java/ravenwood.go")
          PY
          rm -rf .repo/project-objects .repo/projects

      - name: Stage poplar device, vendor, and kernel trees
        run: |
          WORK="$HOME/work"
          mkdir -p "$WORK/device/lenovo" "$WORK/vendor/lenovo" "$WORK/kernel/lenovo"
          cp -a "$GITHUB_WORKSPACE/src_device" "$WORK/device/lenovo/poplar"
          git clone --depth=1 -b lineage-21.0 \
            https://github.com/BangerSoul/proprietary_vendor_lenovo_poplar.git \
            "$WORK/vendor/lenovo/poplar"
          git clone --depth=1 -b lineage-21.0 \
            https://github.com/BangerSoul/android_kernel_lenovo_poplar.git \
            "$WORK/kernel/lenovo/poplar"

      - name: Build vendorbootimage (${{ matrix.variant }})
        run: |
          cd "$HOME/work"
          export USE_CCACHE=1
          export GOGC=50
          export RECOVERY_VARIANT="${{ matrix.variant }}"
          export ALLOW_MISSING_DEPENDENCIES=true
          if [ "${{ matrix.variant }}" = "twrp" ]; then
            bash device/lenovo/poplar/recovery/build-twrp.sh --lunch twrp_poplar-eng --jobs "$(nproc)"
          elif [ "${{ matrix.variant }}" = "orangefox" ]; then
            bash device/lenovo/poplar/recovery/build-orangefox.sh --lunch twrp_poplar-eng --jobs "$(nproc)"
          else
            bash device/lenovo/poplar/recovery/build-aosp.sh --lunch aosp_poplar-userdebug --jobs "$(nproc)"
          fi

      - name: Package & verify Boot v4 vendor_boot.img
        run: |
          cd "$HOME/work"
          OUT_DIR="out/target/product/poplar"
          ART_DIR="$GITHUB_WORKSPACE/ci-artifacts/${{ matrix.variant }}"
          mkdir -p "$ART_DIR"
          VBOOT="$OUT_DIR/vendor_boot.img"
          test -f "$VBOOT"
          SIZE=$(stat -c %s "$VBOOT")
          echo "vendor_boot.img size: $SIZE bytes"
          test "$SIZE" -le 67108864
          OUT_NAME="poplar-${{ matrix.variant }}-vendor_boot-${GITHUB_SHA::7}.img"
          cp "$VBOOT" "$ART_DIR/$OUT_NAME"
          cp "$OUT_DIR/dtb.img" "$ART_DIR/" 2>/dev/null || true
          if [ -x out/host/linux-x86/bin/unpack_bootimg ]; then
            TMPU="$(mktemp -d)"
            out/host/linux-x86/bin/unpack_bootimg --boot_img "$ART_DIR/$OUT_NAME" --out "$TMPU" | tee "$ART_DIR/unpack_bootimg.txt"
            grep -qE '^dtb size: [1-9][0-9]+' "$ART_DIR/unpack_bootimg.txt"
            rm -rf "$TMPU"
          fi
          (cd "$ART_DIR" && sha256sum "$OUT_NAME" > "${OUT_NAME}.sha256sum")
          cat "$ART_DIR/${OUT_NAME}.sha256sum"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: poplar-recovery-${{ matrix.variant }}
          path: ci-artifacts/${{ matrix.variant }}/
          if-no-files-found: error
