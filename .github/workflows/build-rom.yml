name: Build LineageOS 21.0 Full ROM (16x32 Pruned)

# ── Namespace 16x32 Full ROM Workflow & Free-Trial Rules ───────────────────────
# Plan: Namespace Developer trial (`32 vCPU / 64 GB RAM`, `180 min` max job cap).
# Runner: `16x32 Optimal` (16 vCPU, 32 GB RAM, 160 GB disk; 16 unit-min/min).
# Disk budget on 160 GB instance (~150 GB usable):
#   • Pre-sync pruning (`--groups=-darwin,-cts` + `prune-unused.xml`): skips CTS,
#     emulator/cuttlefish/goldfish, ABI dumps (w/ SKIP_ABI_CHECKS=true), kernel
#     clang, deqp, and unused QCOM SoC HALs (~14 GB saved before download).
#   • Post-sync pruning (`rm -rf`): strips `.repo/project-objects`, `.repo/projects`,
#     `.repo/repo`, `.repo/manifests.git` (~14 GB) + unused Rust (~15 GB) + unused
#     Clang (~9 GB), leaving ~55 GB source and ~90+ GB free for `out/` + ROM zip.
# Rules enforced below:
#   1. Manual `workflow_dispatch` only — prevents git pushes from burning compute.
#   2. `timeout-minutes: 170` — stays under Developer's 180-min (3h) ceiling.
#   3. `concurrency: cancel-in-progress: true` — prevents overlapping ROM runs.
#   4. Compact 4G scratch swap (since 16x32 already has 32 GB physical RAM).
#   5. GitHub Pre-Release upload — avoids the 500 MB Actions artifact storage cap.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      lunch_variant:
        description: "Lunch build variant"
        required: true
        type: choice
        default: userdebug
        options:
          - userdebug
          - eng
          - user
      target:
        description: "Make target (`bacon` for full flashable ROM zip)"
        required: true
        type: choice
        default: bacon
        options:
          - bacon
          - bootimage
      runner:
        description: "Namespace machine shape (`16x32` = 160GB disk, `32x64` = 288GB disk)"
        required: true
        type: choice
        default: namespace-16x32
        options:
          - namespace-16x32
          - namespace-32x64
      publish_release:
        description: "Upload built ROM zip & boot images to a GitHub Pre-Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_rom:
    name: Build ROM (${{ github.event.inputs.target || 'bacon' }} / ${{ github.event.inputs.runner || 'namespace-16x32' }})
    runs-on: ${{ (github.event.inputs.runner == 'namespace-32x64') && fromJSON('["nscloud-ubuntu-22.04-amd64-32x64-with-features", "namespace-features:container.privileged=true;container.mount-scratch=true"]') || fromJSON('["nscloud-ubuntu-22.04-amd64-16x32-with-features", "namespace-features:container.privileged=true;container.mount-scratch=true"]') }}
    timeout-minutes: 170

    steps:
      - name: Maximize disk space, install deps & setup 4G scratch swap
        run: |
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/az /opt/google/chrome /opt/microsoft || true
          sudo docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 cpio
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          git lfs install
          SWAP_TARGET="/ci-swapfile"
          if [ -d /namespace/scratch ]; then
            SWAP_TARGET="/namespace/scratch/swapfile"
          fi
          if [ ! -f "$SWAP_TARGET" ]; then
            sudo fallocate -l 4G "$SWAP_TARGET" || sudo dd if=/dev/zero of="$SWAP_TARGET" bs=1M count=4096 status=none
            sudo chmod 600 "$SWAP_TARGET"
            sudo mkswap "$SWAP_TARGET"
            sudo swapon "$SWAP_TARGET" || echo "WARN: swapon unavailable; continuing with physical RAM"
          fi
          sudo sysctl -w vm.swappiness=20 || true
          df -h / /namespace/scratch 2>/dev/null || df -h
          free -h
          nproc

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.local/bin/repo"
          chmod +x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.name "CI Builder"
          git config --global user.email "ci-builder@users.noreply.github.com"
          git config --global color.ui false

      - name: Checkout poplar device tree (self)
        uses: actions/checkout@v4
        with:
          path: src_device

      - name: Sync & prune LineageOS 21.0 workspace for full ROM build
        run: |
          mkdir -p "$HOME/work" && cd "$HOME/work"
          repo init --depth=1 \
            -u https://github.com/LineageOS/android.git -b lineage-21.0 \
            --groups=default,-darwin,-cts,-notdefault --git-lfs
          mkdir -p .repo/local_manifests
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.Element("manifest")
          seen = set()

          def add_rm(path):
              if path and path not in seen:
                  seen.add(path)
                  ET.SubElement(root, "remove-project", {"path": path, "optional": "true"})

          # Heavy non-ROM projects safe to skip for lineage_poplar full ROM build
          exact_prunes = [
              "cts",
              "prebuilts/abi-dumps/ndk",
              "prebuilts/abi-dumps/platform",
              "prebuilts/abi-dumps/vndk",
              "prebuilts/android-emulator",
              "prebuilts/qemu-kernel",
              "prebuilts/gradle-plugin",
              "prebuilts/clang/kernel/linux-x86/clang-r416183b",
              "prebuilts/gcc/linux-x86/host/x86_64-w64-mingw32-4.8",
              "external/deqp",
              "external/deqp-deps",
              "device/google/atv",
              "device/google_car",
              "device/google/cuttlefish",
              "device/google/cuttlefish_prebuilts",
              "device/google/cuttlefish_vmm",
              "device/generic/car",
              "device/generic/goldfish",
              "device/generic/goldfish-opengl",
              "device/generic/mini-emulator-arm64",
              "device/generic/mini-emulator-armv7-a-neon",
              "device/generic/mini-emulator-x86",
              "device/generic/mini-emulator-x86_64",
              "device/generic/uml",
              "device/generic/x86",
              "device/generic/x86_64",
              "device/generic/vulkan-cereal",
          ]
          for p in exact_prunes:
              add_rm(p)

          # Prune unused Qualcomm SoC HALs & sepolicy (poplar is MediaTek MT6768)
          for mf in (Path(".repo/manifests/default.xml"), Path(".repo/manifests/snippets/lineage.xml")):
              if not mf.is_file():
                  continue
              tree = ET.parse(mf).getroot()
              for proj in tree.findall("project"):
                  path = proj.get("path") or proj.get("name") or ""
                  if path.startswith(("device/qcom/", "hardware/qcom/", "hardware/qcom-caf/")) and path != "hardware/qcom-caf/common":
                      add_rm(path)

          ET.indent(root, space="    ")
          ET.ElementTree(root).write(".repo/local_manifests/prune-unused.xml", encoding="utf-8", xml_declaration=True)
          print("Pre-sync remove-project entries:", len(seen))
          PY

          repo sync -c -j8 --no-tags --no-clone-bundle --force-sync --optimized-fetch

          echo "=== Disk usage BEFORE post-sync prune ==="
          df -h / /namespace/scratch 2>/dev/null || df -h

          # Reclaim ~38 GB of git object stores & inactive host toolchains while keeping
          # clang-r510928 (ClangDefaultVersion) and rust 1.75.0 (RustDefaultVersion)
          rm -rf \
            .repo/project-objects \
            .repo/projects \
            .repo/repo \
            .repo/manifests.git \
            .repo/TRACE_FILE \
            prebuilts/abi-dumps \
            prebuilts/android-emulator \
            prebuilts/qemu-kernel \
            prebuilts/rust/darwin-x86 \
            prebuilts/rust/windows-x86 \
            prebuilts/rust/linux-musl-x86 \
            prebuilts/rust/linux-x86/1.73.0 \
            prebuilts/rust/linux-x86/1.74.1 \
            prebuilts/clang/host/linux-x86/clang-r498229b \
            prebuilts/clang/host/linux-x86/clang-r487747c \
            prebuilts/clang/host/linux-x86/clang-r475365b \
            prebuilts/clang/host/linux-x86/clang-r450784e

          echo "=== Disk usage AFTER post-sync prune ==="
          df -h / /namespace/scratch 2>/dev/null || df -h

      - name: Stage poplar device, vendor, kernel, and MediaTek trees
        run: |
          WORK="$HOME/work"
          mkdir -p "$WORK/device/lenovo" "$WORK/vendor/lenovo" "$WORK/kernel/lenovo" \
                   "$WORK/hardware" "$WORK/device/mediatek"
          cp -a "$GITHUB_WORKSPACE/src_device" "$WORK/device/lenovo/poplar"
          git clone --depth=1 -b lineage-21.0 \
            https://github.com/BangerSoul/proprietary_vendor_lenovo_poplar.git \
            "$WORK/vendor/lenovo/poplar"
          git clone --depth=1 -b lineage-21.0 \
            https://github.com/BangerSoul/android_kernel_lenovo_poplar.git \
            "$WORK/kernel/lenovo/poplar"
          git clone --depth=1 -b lineage-21 \
            https://github.com/LineageOS/android_hardware_mediatek.git \
            "$WORK/hardware/mediatek"
          git clone --depth=1 -b lineage-21 \
            https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git \
            "$WORK/device/mediatek/sepolicy_vndr"

      - name: Build LineageOS 21.0 (${{ github.event.inputs.target || 'bacon' }})
        run: |
          cd "$HOME/work"
          export LC_ALL=C
          export SKIP_ABI_CHECKS=true
          export GOGC=50
          LUNCH_VARIANT="${{ github.event.inputs.lunch_variant || 'userdebug' }}"
          BUILD_TARGET="${{ github.event.inputs.target || 'bacon' }}"

          set +e +u
          set +o pipefail
          source build/envsetup.sh
          if [[ -f build/release/build_config/ap2a.scl ]]; then
            lunch "lineage_poplar-ap2a-${LUNCH_VARIANT}"
          else
            lunch "lineage_poplar-${LUNCH_VARIANT}"
          fi
          lunch_rc=$?
          ((lunch_rc == 0)) || exit "$lunch_rc"

          (
            while true; do
              sleep 180
              echo "[ci-mon $(date -u +%H:%M:%SZ)] disk=$(df -h / | awk 'NR==2{print $4"/"$2" ("$5")"}') mem=$(free -m | awk '/Mem:/{print $3"/"$2"M"}') swap=$(free -m | awk '/Swap:/{print $3"/"$2"M"}')"
            done
          ) &
          MON_PID=$!
          trap 'kill "$MON_PID" 2>/dev/null || true' EXIT

          # Apply priority to current shell so bash function `m` runs directly
          renice -n 10 -p $$ >/dev/null 2>&1 || true
          ionice -c 2 -n 7 -p $$ >/dev/null 2>&1 || true
          m -j"$(nproc)" "$BUILD_TARGET"
          build_rc=$?

          kill "$MON_PID" 2>/dev/null || true
          wait "$MON_PID" 2>/dev/null || true
          trap - EXIT
          set -euo pipefail
          df -h / /namespace/scratch 2>/dev/null || df -h
          free -h
          exit "$build_rc"

      - name: Verify outputs & stage release payload
        run: |
          cd "$HOME/work"
          OUT_DIR="out/target/product/poplar"
          REL_DIR="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$REL_DIR"

          AVBTOOL="out/host/linux-x86/bin/avbtool"
          UNPACK="out/host/linux-x86/bin/unpack_bootimg"

          for img in boot.img init_boot.img vendor_boot.img vbmeta.img vbmeta_system.img vbmeta_vendor.img; do
            if [ -f "$OUT_DIR/$img" ]; then
              cp "$OUT_DIR/$img" "$REL_DIR/"
            fi
          done

          test -f "$REL_DIR/boot.img"
          test "$(stat -c %s "$REL_DIR/boot.img")" -eq 33554432

          if [ -x "$AVBTOOL" ]; then
            "$AVBTOOL" info_image --image "$REL_DIR/boot.img" | tee "$REL_DIR/boot-avb.txt"
            grep -qE '^Original image size:[[:space:]]+14561280 bytes' "$REL_DIR/boot-avb.txt"
            grep -qE '^VBMeta offset:[[:space:]]+14561280$' "$REL_DIR/boot-avb.txt"
          fi
          if [ -f "$REL_DIR/vendor_boot.img" ] && [ -x "$UNPACK" ]; then
            "$UNPACK" --boot_img "$REL_DIR/vendor_boot.img" --out /tmp/vboot_check | tee "$REL_DIR/vboot-unpack.txt"
            grep -qE '^dtb size: [1-9][0-9]+' "$REL_DIR/vboot-unpack.txt"
            rm -rf /tmp/vboot_check
          fi

          ROM_ZIP=$(ls -1 "$OUT_DIR"/lineage-*.zip 2>/dev/null | head -n 1 || true)
          if [ "${{ github.event.inputs.target || 'bacon' }}" = "bacon" ]; then
            test -n "$ROM_ZIP"
            cp "$ROM_ZIP" "$REL_DIR/"
            [ -f "${ROM_ZIP}.sha256sum" ] && cp "${ROM_ZIP}.sha256sum" "$REL_DIR/"
          fi

          (cd "$REL_DIR" && sha256sum * > /tmp/SHA256SUMS.txt && mv /tmp/SHA256SUMS.txt SHA256SUMS.txt)
          ls -lh "$REL_DIR"
          {
            echo "## LineageOS 21.0 ROM Build Summary"
            echo "- Runner: \`${{ github.event.inputs.runner || 'namespace-16x32' }}\`"
            echo "- Target: \`${{ github.event.inputs.target || 'bacon' }}\` (\`${{ github.event.inputs.lunch_variant || 'userdebug' }}\`)"
            echo '```'
            cat "$REL_DIR/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Pre-Release
        if: inputs.publish_release != false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ci-rom-${{ github.run_id }}
          REL_DIR: ${{ github.workspace }}/release-assets
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          tag = f"{os.environ['REL_TAG']}-{sha[:7]}"
          rel_dir = Path(os.environ["REL_DIR"])

          payload = json.dumps({
              "tag_name": tag,
              "target_commitish": sha,
              "name": f"LineageOS 21.0 CI ({tag})",
              "body": f"Automated Namespace CI ROM build for `{sha[:7]}` (run {run_id}).",
              "draft": False,
              "prerelease": True,
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              rel = json.loads(r.read().decode())
          upload_base = rel["upload_url"].split("{")[0]
          print("Created release:", rel["html_url"])

          for p in sorted(rel_dir.iterdir()):
              if not p.is_file():
                  continue
              print(f"Uploading {p.name} ({p.stat().st_size} bytes)...")
              subprocess.run([
                  "curl", "-fsSL", "-X", "POST",
                  "-H", f"Authorization: Bearer {token}",
                  "-H", "Content-Type: application/octet-stream",
                  "--data-binary", f"@{p}",
                  f"{upload_base}?name={p.name}",
              ], check=True)
          PY
